services:
  messwa:
    build: .
    image: messwa:latest
    container_name: messwa
    restart: unless-stopped
    user: "1000:1000"
    # Host networking so the dashboard can bind the host address from config.toml
    # and the MCP server stays on loopback, where it needs no token.
    network_mode: host
    env_file:
      - path: .env          # Optional MESSWA_MCP_TOKEN and MESS_API_KEY/MESS_API_URL
        required: false
    volumes:
      - ./config.toml:/data/config.toml:ro
      - ./state:/data/state
